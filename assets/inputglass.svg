  <path d="M165 198v-84c0-9 7-16 16-16h22c9 0 16 7 16 16v84z" fill="url(#amber)"/>
  <path d="M40 198h176" fill="none" stroke="#e8eff9" stroke-linecap="round" stroke-width="8"/>
  <circle cx="72" cy="73" r="8" fill="#e8eff9" opacity=".9"/>
  <circle cx="132" cy="95" r="8" fill="#e8eff9" opacity=".9"/>
  <circle cx="192" cy="121" r="8" fill="#e8eff9" opacity=".9"/>
