<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">InputGlass icon</title>
  <desc id="description">Three luminous signal bars inside a dark glass tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151f31"/>
      <stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7ce3ff"/>
      <stop offset="1" stop-color="#32b9ed"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b99aff"/>
      <stop offset="1" stop-color="#865be8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd282"/>
      <stop offset="1" stop-color="#f5a72d"/>
