name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install MinGW-w64 toolchain
        run: sudo apt-get update && sudo apt-get install --yes cmake gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 shellcheck

      - name: Check build script
        run: shellcheck build.sh

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"

      - name: Build InputGlass
        run: ./build.sh

      - name: Verify Windows executable
        run: |
          file build/bin/InputGlass.exe
          x86_64-w64-mingw32-objdump -p build/bin/InputGlass.exe > build/InputGlass-pe-metadata.txt
          test -s build/bin/InputGlass.exe

      - name: Package portable release
        run: |
          mkdir -p dist/InputGlass
          x86_64-w64-mingw32-strip build/bin/InputGlass.exe
          cp build/bin/InputGlass.exe README.md LICENSE dist/InputGlass/
          cmake -E chdir dist cmake -E tar cf InputGlass-windows-x64.zip --format=zip InputGlass

      - name: Create checksum
        working-directory: dist
        run: sha256sum InputGlass-windows-x64.zip > InputGlass-windows-x64.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InputGlass-windows-x64
          path: |
            dist/InputGlass-windows-x64.zip
            dist/InputGlass-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: InputGlass-windows-x64
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/InputGlass-windows-x64.zip dist/InputGlass-windows-x64.zip.sha256 --verify-tag --generate-notes --title "InputGlass $GITHUB_REF_NAME"
